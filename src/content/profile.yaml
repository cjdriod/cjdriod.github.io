profile:
  tagline: Solution design & cloud architecture
  name: Jack Lim
  legalName: Lim Chun Jie
  role: Technical Lead | Technical Architect
  landingSeoRole: Technical Architect & Tech Lead
  landingSeoDescription: >-
    Technical Architect and Tech Lead designing secure, cost-efficient Azure and AWS solutions, from business
    requirements to governed, production-ready delivery.
  description: >-
    I turn business requirements into secure, cost-efficient cloud solutions on Azure
    and AWS. As a tech lead and technical architect, I own solution and integration
    design for high-traffic platforms across e-commerce and agriculture, guide delivery
    teams through architecture and compliance reviews, and design systems that keep
    delivering long after launch.
  resumeSummary: >-
    Technical Lead and Technical Architect with nearly 8 years of experience delivering secure, scalable cloud
    platforms on Azure and AWS. Owns solution design for multi-country agriculture loyalty platforms serving 50,000+
    growers, translating business requirements into solution designs, shaping integration architecture, and steering
    proposals through PRA, compliance, and architecture reviews. Cut annual Azure infrastructure costs by 68% using
    Well-Architected principles. AWS Solutions Architect – Associate and Azure AZ-305 certified, bringing hands-on
    full-stack depth to architecture decisions, security by design, and cross-team alignment.
  highlights:
    - Cut annual Azure infrastructure costs by 68% through Well-Architected right-sizing and consolidation.
    - Own solution and integration design (SSO, SCIM, OneTrust, Pine Labs) for platforms serving 50,000+ growers.
    - Steer designs through PRA, compliance, and architecture reviews, with SDD and Authorization Concept kept current.
    - Improved MTTR by 60%, sustained a 99.93% SLA, and cut production outages from 8 to 1 in a year.
    - Achieved 86% cost reduction on Google Maps services (RM20K → RM2.8K/month) through architectural optimisation.
  professionalSummary:
    - >
      Technical Lead and Technical Architect with nearly 8 years of experience building secure, scalable, and
      resilient digital platforms across e-commerce and agriculture. Owns solution design for multi-country loyalty
      platforms serving 50,000+ growers, from engaging business stakeholders and evaluating solution options and guiding
      delivery teams on architecture, integrations, and non-functional requirements.
    - >
      Experienced in architecture governance, including Protection Requirement Assessments (PRA), compliance checks,
      and architecture reviews, and in aligning business, security, platform, data, and vendor teams on shared
      technical approaches. Pairs cost-conscious Azure Well-Architected design, which cut annual infrastructure costs
      by 68%, with hands-on DevSecOps and observability depth, backed by AWS Solutions Architect – Associate and AZ-305
      certifications.
